<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2634d5" />
    <meta name="description" content="Hệ thống đặt món và quản lý Canteen VWA" />

    <!-- Favicon: SVG cho browser hiện đại -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- ✅ FIX: apple-touch-icon cần PNG (iOS không hỗ trợ SVG).
         Nếu chưa có PNG, iOS sẽ tự chụp screenshot trang làm icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Canteen VWA" />

    <!-- Open Graph (Facebook/Zalo share) -->
    <!-- ✅ FIX: OG image phải là PNG/JPG, không dùng SVG.
         Kích thước khuyến nghị 1200×630. -->
    <meta property="og:title" content="Canteen VWA" />
    <meta property="og:description" content="Đặt món nhanh — Quản lý gọn" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canteen VWA" />
    <meta name="twitter:description" content="Đặt món nhanh — Quản lý gọn" />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Canteen VWA — Quản lý Canteen</title>

    <!-- Anti-FOUC theme script: chạy TRƯỚC khi CSS parse -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved;
          if (saved !== "light" && saved !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>Vui lòng bật JavaScript để sử dụng Canteen VWA.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
